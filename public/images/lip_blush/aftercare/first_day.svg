<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb6c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc0cb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Clock showing "Day 1" -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="100" cy="100" r="38" fill="#fff9e6" opacity="0.8"/>
  <line x1="100" y1="100" x2="100" y2="65" stroke="#2c3e50" stroke-width="2"/>
  <line x1="100" y1="100" x2="115" y2="100" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#2c3e50"/>
  <text x="100" y="155" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">First 24 Hours</text>
  
  <!-- Lips with moisture -->
  <ellipse cx="250" cy="120" rx="40" ry="25" fill="url(#moistGrad)"/>
  <ellipse cx="250" cy="120" rx="40" ry="23" fill="#ffb3d9" opacity="0.4"/>
  
  <!-- Moisture droplets -->
  <circle cx="220" cy="110" r="5" fill="#87ceeb" opacity="0.8"/>
  <circle cx="280" cy="115" r="5" fill="#87ceeb" opacity="0.8"/>
  <circle cx="250" cy="145" r="5" fill="#87ceeb" opacity="0.8"/>
  
  <!-- Ointment jar and application -->
  <rect x="160" y="220" width="50" height="60" fill="#fff" stroke="#8b7355" stroke-width="2" rx="3"/>
  <ellipse cx="185" cy="220" rx="25" ry="12" fill="#f5deb3" stroke="#8b7355" stroke-width="1"/>
  <text x="185" y="255" font-size="10" text-anchor="middle" fill="#8b7355" font-weight="bold">Ointment</text>
  
  <!-- Arrow showing application -->
  <path d="M 210 240 L 240 150" stroke="#ff6b9d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Gentle care instructions -->
  <rect x="120" y="300" width="260" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="250" y="325" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">What to do:</text>
  <text x="250" y="345" font-size="11" text-anchor="middle" fill="#666">✓ Remove lymph fluid gently</text>
  <text x="250" y="362" font-size="11" text-anchor="middle" fill="#666">✓ After 4 hours: Apply ointment regularly</text>
  <text x="250" y="375" font-size="11" text-anchor="middle" fill="#666">✗ Avoid kissing, rubbing, friction</text>
</svg>