<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- 4-6 weeks indicator -->
  <circle cx="100" cy="80" r="30" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="100" y="90" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">Week 4-6</text>
  
  <!-- Fully healed lips -->
  <ellipse cx="250" cy="120" rx="40" ry="26" fill="#ff6b9d" opacity="0.8"/>
  <ellipse cx="250" cy="120" rx="40" ry="24" fill="#ffb3d9" opacity="0.5"/>
  
  <!-- Shine/healthy glow -->
  <ellipse cx="235" cy="105" rx="15" ry="10" fill="#ffeaa7" opacity="0.7"/>
  <circle cx="250" cy="120" r="42" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5" opacity="0.8"/>
  
  <!-- Checkmark for healed -->
  <circle cx="310" cy="80" r="25" fill="#4caf50" opacity="0.8"/>
  <path d="M 300 85 L 310 95 L 325 75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Status boxes -->
  <rect x="40" y="200" width="320" height="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="200" y="225" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Fully Healed & Ready!</text>
  <text x="200" y="245" font-size="11" text-anchor="middle" fill="#666">✓ Lips are completely healed</text>
  <text x="200" y="262" font-size="11" text-anchor="middle" fill="#666">✓ Ready for touch-up if needed</text>
  
  <!-- Next steps -->
  <rect x="40" y="300" width="320" height="75" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="200" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Next Steps:</text>
  <text x="200" y="345" font-size="11" text-anchor="middle" fill="#666">Schedule touch-up appointment for best color results</text>
  <text x="200" y="365" font-size="11" text-anchor="middle" fill="#666">Maintain with daily lip care</text>
</svg>