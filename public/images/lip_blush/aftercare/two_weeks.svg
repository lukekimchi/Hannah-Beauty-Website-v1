<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- 2 weeks indicator -->
  <circle cx="100" cy="80" r="30" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="100" y="90" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Week 2</text>
  
  <!-- Timeline -->
  <line x1="50" y1="170" x2="350" y2="170" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Healing stages -->
  <circle cx="100" cy="170" r="12" fill="#ff6b9d"/>
  <text x="100" y="145" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">Procedure</text>
  
  <circle cx="180" cy="170" r="12" fill="#ff8fab"/>
  <text x="180" y="145" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">1 Week</text>
  
  <circle cx="260" cy="170" r="12" fill="#ffb3d9"/>
  <text x="260" y="145" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">2 Weeks</text>
  
  <circle cx="340" cy="170" r="12" fill="#ffc0cb"/>
  <text x="340" y="145" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">4-6 Weeks</text>
  
  <!-- Status at 2 weeks -->
  <text x="200" y="230" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Status at Week 2:</text>
  
  <rect x="60" y="250" width="140" height="90" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="130" y="275" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">✓ Peeling Complete</text>
  <text x="130" y="295" font-size="11" text-anchor="middle" fill="#666">Color has faded to</text>
  <text x="130" y="310" font-size="11" text-anchor="middle" fill="#666">lighter shade</text>
  <text x="130" y="330" font-size="11" text-anchor="middle" fill="#666">Still healing</text>
  
  <!-- Ongoing care -->
  <rect x="200" y="250" width="140" height="90" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="270" y="275" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">Continue Care:</text>
  <text x="270" y="295" font-size="11" text-anchor="middle" fill="#666">Keep lips</text>
  <text x="270" y="310" font-size="11" text-anchor="middle" fill="#666">well moisturized</text>
  <text x="270" y="330" font-size="11" text-anchor="middle" fill="#666">More color emerging</text>
</svg>