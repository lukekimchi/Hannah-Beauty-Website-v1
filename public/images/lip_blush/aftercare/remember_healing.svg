<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Number badges -->
  <circle cx="80" cy="80" r="28" fill="#ff6b9d" opacity="0.8"/>
  <text x="80" y="90" font-size="32" text-anchor="middle" fill="white" font-weight="bold">1</text>
  
  <circle cx="200" cy="80" r="28" fill="#ff6b9d" opacity="0.8"/>
  <text x="200" y="90" font-size="32" text-anchor="middle" fill="white" font-weight="bold">2</text>
  
  <circle cx="320" cy="80" r="28" fill="#ff6b9d" opacity="0.8"/>
  <text x="320" y="90" font-size="32" text-anchor="middle" fill="white" font-weight="bold">3</text>
  
  <!-- Avoid hot/spicy food icon -->
  <path d="M 60 180 L 65 140 L 70 180" fill="#dc143c"/>
  <circle cx="65" cy="180" r="25" fill="none" stroke="#ff6347" stroke-width="2"/>
  <text x="65" y="185" font-size="20" text-anchor="middle">🌶️</text>
  
  <!-- Avoid water icon -->
  <circle cx="200" cy="170" r="25" fill="#87ceeb" opacity="0.3" stroke="#1e90ff" stroke-width="2"/>
  <path d="M 200 165 L 200 175" stroke="#1e90ff" stroke-width="2"/>
  <line x1="190" y1="170" x2="210" y2="170" stroke="#1e90ff" stroke-width="2"/>
  <circle cx="200" cy="170" r="25" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <line x1="180" y1="150" x2="220" y2="190" stroke="#e74c3c" stroke-width="3"/>
  <line x1="220" y1="150" x2="180" y2="190" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- Don't pick icon -->
  <ellipse cx="320" cy="180" rx="25" ry="35" fill="#fdbcb4"/>
  <path d="M 305 160 L 320 145 L 335 160" fill="#ff69b4" opacity="0.6"/>
  <line x1="310" y1="180" x2="290" y2="180" stroke="#e74c3c" stroke-width="3"/>
  <line x1="330" y1="180" x2="350" y2="180" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- Important tips at bottom -->
  <rect x="40" y="280" width="320" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="200" y="305" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">6 Important Things to Remember</text>
  <text x="200" y="330" font-size="11" text-anchor="middle" fill="#666">• Avoid hot, spicy, salty foods</text>
  <text x="200" y="350" font-size="11" text-anchor="middle" fill="#666">• Don't pick or scratch • Avoid water</text>
</svg>