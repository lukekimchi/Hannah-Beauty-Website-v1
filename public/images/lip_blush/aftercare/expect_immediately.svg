<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Timeline -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Stage 1: Swelling -->
  <circle cx="100" cy="200" r="20" fill="#ff6b9d" opacity="0.8"/>
  <text x="100" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">0h</text>
  <ellipse cx="100" cy="120" rx="40" ry="50" fill="#ffb3d9" opacity="0.5"/>
  <text x="100" y="140" font-size="12" text-anchor="middle" fill="#c2185b" font-weight="bold">Swollen</text>
  
  <!-- Stage 2: Regress -->
  <circle cx="200" cy="200" r="20" fill="#ff6b9d" opacity="0.8"/>
  <text x="200" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">3-4 days</text>
  <ellipse cx="200" cy="120" rx="35" ry="45" fill="#ff8fab" opacity="0.5"/>
  <text x="200" y="140" font-size="12" text-anchor="middle" fill="#c2185b" font-weight="bold">Less Swelling</text>
  
  <!-- Stage 3: Fading -->
  <circle cx="300" cy="200" r="20" fill="#ff6b9d" opacity="0.8"/>
  <text x="300" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">+6-8 weeks</text>
  <ellipse cx="300" cy="120" rx="30" ry="40" fill="#ffb3d9" opacity="0.3"/>
  <text x="300" y="140" font-size="12" text-anchor="middle" fill="#c2185b" font-weight="bold">Faded 30-40%</text>
  
  <!-- Intensity gauge -->
  <text x="50" y="300" font-size="12" fill="#2c3e50" font-weight="bold">Intensity:</text>
  <rect x="50" y="310" width="300" height="15" fill="#e8e8e8" rx="7"/>
  <rect x="50" y="310" width="100" height="15" fill="#ff6b9d" rx="7"/>
  <circle cx="100" cy="317" r="5" fill="white" stroke="#ff6b9d" stroke-width="2"/>
  <line x1="100" y1="330" x2="100" y2="345" stroke="#ff6b9d" stroke-width="1"/>
  <text x="100" y="360" font-size="10" text-anchor="middle" fill="#666">Reduces by 3-4 days</text>
  
  <!-- Info box -->
  <rect x="50" y="370" width="300" height="20" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="3"/>
  <text x="200" y="385" font-size="11" text-anchor="middle" fill="#2c3e50">Be patient - natural healing process!</text>
</svg>