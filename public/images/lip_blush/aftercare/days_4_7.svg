<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Days 4-7 indicator -->
  <circle cx="100" cy="80" r="30" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="100" y="75" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">Days</text>
  <text x="100" y="95" font-size="18" text-anchor="middle" fill="#2c3e50" font-weight="bold">4-7</text>
  
  <!-- Peeling process visualization -->
  <text x="200" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Peeling Phase</text>
  
  <!-- Lip stages -->
  <ellipse cx="180" cy="140" rx="30" ry="20" fill="#ff8fab" opacity="0.7"/>
  <text x="180" y="145" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Start</text>
  
  <path d="M 215 140 L 225 140" stroke="#2c3e50" stroke-width="2"/>
  
  <ellipse cx="260" cy="140" rx="30" ry="20" fill="#ffb3d9" opacity="0.5"/>
  <path d="M 250 130 L 255 135 M 258 128 L 263 133 M 266 130 L 271 135" stroke="#e74c3c" stroke-width="1"/>
  <text x="260" y="145" font-size="10" text-anchor="middle" fill="#c2185b" font-weight="bold">Peeling</text>
  
  <!-- Color fading indicator -->
  <rect x="80" y="200" width="240" height="20" fill="#e8e8e8" rx="10"/>
  <rect x="80" y="200" width="120" height="20" fill="#ff6b9d" rx="10"/>
  <circle cx="140" cy="210" r="5" fill="white" stroke="#ff6b9d" stroke-width="1"/>
  <text x="330" y="215" font-size="11" fill="#2c3e50" font-weight="bold">-30-50%</text>
  
  <!-- Care instructions -->
  <rect x="60" y="260" width="280" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="200" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Peeling Care:</text>
  
  <text x="75" y="310" font-size="11" fill="#2c3e50">✓ Let skin shed naturally (don't rub)</text>
  <text x="75" y="330" font-size="11" fill="#2c3e50">✓ Keep lips heavily moisturized</text>
  <text x="75" y="350" font-size="11" fill="#2c3e50">✗ Never pick or scratch</text>
  <text x="75" y="370" font-size="11" fill="#2c3e50">✓ Continue ointment application</text>
</svg>