<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Warning symbol -->
  <circle cx="100" cy="80" r="35" fill="#ff9800" opacity="0.8"/>
  <text x="100" y="92" font-size="40" text-anchor="middle" fill="white">⚠️</text>
  
  <!-- 14-day period -->
  <circle cx="300" cy="80" r="30" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="75" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">14</text>
  <text x="300" y="95" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">Days</text>
  
  <!-- Activities grid - 4x3 -->
  <text x="200" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Activities to AVOID:</text>
  
  <!-- Row 1 -->
  <circle cx="80" cy="190" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="80" y="197" font-size="20" text-anchor="middle">🏊</text>
  <text x="80" y="225" font-size="10" text-anchor="middle" fill="#2c3e50">Swimming</text>
  
  <circle cx="200" cy="190" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="200" y="197" font-size="20" text-anchor="middle">♨️</text>
  <text x="200" y="225" font-size="10" text-anchor="middle" fill="#2c3e50">Hot Bath/Sauna</text>
  
  <circle cx="320" cy="190" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="320" y="197" font-size="20" text-anchor="middle">☀️</text>
  <text x="320" y="225" font-size="10" text-anchor="middle" fill="#2c3e50">Sun Exposure</text>
  
  <!-- Row 2 -->
  <circle cx="80" cy="290" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="80" y="297" font-size="20" text-anchor="middle">💪</text>
  <text x="80" y="325" font-size="10" text-anchor="middle" fill="#2c3e50">Exercise</text>
  
  <circle cx="200" cy="290" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="200" y="297" font-size="20" text-anchor="middle">🍷</text>
  <text x="200" y="325" font-size="10" text-anchor="middle" fill="#2c3e50">Alcohol</text>
  
  <circle cx="320" cy="290" r="25" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="320" y="297" font-size="20" text-anchor="middle">🚗</text>
  <text x="320" y="325" font-size="10" text-anchor="middle" fill="#2c3e50">Open-air Vehicles</text>
  
  <!-- Important notice -->
  <rect x="30" y="360" width="340" height="30" fill="#ffe0e0" stroke="#c2185b" stroke-width="2" rx="3"/>
  <text x="200" y="381" font-size="11" text-anchor="middle" fill="#c2185b" font-weight="bold">Protect your healing lips for best results!</text>
</svg>