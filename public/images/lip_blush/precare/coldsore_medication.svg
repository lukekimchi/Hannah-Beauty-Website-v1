<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Medicine bottle -->
  <rect x="140" y="100" width="60" height="120" fill="#e8f4f8" stroke="#4a90a4" stroke-width="2" rx="5"/>
  <rect x="150" y="80" width="40" height="30" fill="#a8d5e2" stroke="#4a90a4" stroke-width="2" rx="3"/>
  <circle cx="170" cy="75" r="8" fill="#d0e8f2" stroke="#4a90a4" stroke-width="1"/>
  
  <!-- Liquid inside -->
  <rect x="145" y="140" width="50" height="70" fill="#c4e3ed" opacity="0.7"/>
  
  <!-- Pills -->
  <ellipse cx="200" cy="200" rx="12" ry="8" fill="#ff6b9d" opacity="0.8"/>
  <ellipse cx="230" cy="220" rx="12" ry="8" fill="#ff6b9d" opacity="0.8"/>
  <ellipse cx="260" cy="210" rx="12" ry="8" fill="#ff6b9d" opacity="0.8"/>
  <ellipse cx="220" cy="250" rx="12" ry="8" fill="#ff6b9d" opacity="0.8"/>
  
  <!-- Calendar -->
  <rect x="120" y="300" width="70" height="70" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="3"/>
  <rect x="120" y="300" width="70" height="20" fill="#2c3e50"/>
  <text x="155" y="315" font-size="14" text-anchor="middle" fill="white" font-weight="bold">2 Days</text>
  <line x1="140" y1="330" x2="180" y2="330" stroke="#2c3e50" stroke-width="1"/>
  <text x="155" y="360" font-size="12" text-anchor="middle" fill="#2c3e50">Before</text>
  
  <!-- Check mark -->
  <circle cx="280" cy="330" r="30" fill="#4caf50" opacity="0.3"/>
  <path d="M 265 330 L 275 340 L 295 320" stroke="#4caf50" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>