<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#fef3f0"/>
  
  <!-- Water bottle -->
  <rect x="100" y="80" width="60" height="150" fill="#e8f4f8" stroke="#4a90a4" stroke-width="2" rx="5"/>
  <rect x="112" y="60" width="36" height="25" fill="#a8d5e2" stroke="#4a90a4" stroke-width="2" rx="2"/>
  <circle cx="130" cy="55" r="6" fill="#d0e8f2"/>
  
  <!-- Water inside -->
  <rect x="105" y="140" width="50" height="80" fill="url(#waterGrad)" opacity="0.8"/>
  
  <!-- Lips with hydration glow -->
  <ellipse cx="250" cy="200" rx="45" ry="28" fill="#d4505a"/>
  <ellipse cx="250" cy="200" rx="45" ry="28" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.5"/>
  <ellipse cx="250" cy="200" rx="42" ry="25" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.3"/>
  
  <!-- Moisture droplets on lips -->
  <circle cx="210" cy="190" r="5" fill="#87ceeb" opacity="0.8"/>
  <circle cx="290" cy="195" r="5" fill="#87ceeb" opacity="0.8"/>
  <circle cx="250" cy="225" r="5" fill="#87ceeb" opacity="0.8"/>
  
  <!-- 3-day timeline -->
  <circle cx="150" cy="320" r="20" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="150" y="330" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Day 1</text>
  
  <circle cx="200" cy="320" r="20" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="200" y="330" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Day 2</text>
  
  <circle cx="250" cy="320" r="20" fill="#fdbcb4" stroke="#2c3e50" stroke-width="2"/>
  <text x="250" y="330" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Day 3</text>
  
  <!-- Arrows -->
  <path d="M 170 320 L 180 320" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 220 320 L 230 320" stroke="#2c3e50" stroke-width="2" fill="none"/>
</svg>